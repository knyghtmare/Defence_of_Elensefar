#textdomain wesnoth-Defence_of_Elensefar
[scenario]
    experience_modifier={ON_DIFFICULTY4 80 80 100 120}
    id="01_Defence_of_Elensefar"
    map_file=Defence_of_Elensefar.map
    name= _ "Defence of Elensefar"

    random_start_time=no
    victory_when_enemies_defeated=yes
    next_scenario="02_Epilogue"

    # no turn limit
    turns=-1

    {DAWN}
    {MORNING}
    {AFTERNOON}
    {DUSK}
    {FIRST_WATCH}
    {MIDNIGHT}
    {SECOND_WATCH}
    
    {DEFAULT_MUSIC_PLAYLIST}

    # story text
    [story]
        {DOE_PROLOGUE_STORY_OF_SOTA}
    [/story]

    # side 1: player (Elensefar)
    [side]
        controller="human"
        fog=yes
        {GOLD4 300 275 250 225}
        hidden=no
        income=4
        share_vision="none"
        shroud=yes
        fog=yes
        side=1
        team_name="Heroes"
        user_team_name= _ "Elensefar"
        {FLAG_VARIANT loyalist}
        color=green
        id=Karyk
        name= _ "Lord Karyk"
        unrenamable=yes
        facing="ne"
        type="Royal Warrior"
        [modifications]
            {TRAIT_AGED}
            {TRAIT_INTELLIGENT}
        [/modifications]
        recruit="Bowman, Infantryman, Cavalryman, Adept of Light, Heavy Infantryman"

        # a hero unit
        [unit]
            type="Chevalier"
            unrenamable=yes
            facing="ne"
            id="Varric"
            name=_"Varric"
            x,y=22,19
            [modifications]
                {TRAIT_LOYAL_HERO}
                {TRAIT_RESISTANT}
                {TRAIT_QUICK}
                [object]
                    id=varric_radiance_debuff
                    duration=forever
                    [effect]
                        apply_to=remove_ability
                        [abilities]
                            {ABILITY_RADIANCE}
                        [/abilities]
                    [/effect]
                [/object]
            [/modifications]
        [/unit]
    [/side]

    # side 2: undead
    [side]
        controller="ai"
        fog=no
        facing=nw
        {GOLD4 200 220 220 250}
        hidden=no
        {INCOME4 40 50 50 60}
        no_leader=no
        share_vision="none"
        shroud=no
        side=2
        team_name="Undead"
        user_team_name= _ "Undead"
        {FLAG_VARIANT undead}
        color=white
        id=Ras-Tabahn
        name="King Ras–Tabahn"
        type="Ancient Lich"
        recruit="Walking Corpse, Soulless, Dark Adept, Ghost, Ghoul, Necrophage"
        [ai]
            village_value=20
        [/ai]
    [/side]

    # Give some flavor to Ras' corpse recruits
    {RECRUIT_UNIT_VARIATIONS 2 "Walking Corpse" ("none,dwarf,wolf,saurian,wose")}
    {RECRUIT_UNIT_VARIATIONS 2 "Soulless" ("none,dwarf,wolf,saurian,wose")}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 2 ("Necrophage") 3}

    # side 3: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=3
        team_name="Undead"
        user_team_name= _ "Undead"
        {FLAG_VARIANT undead}
        color=white
        id=NorthLeader
        name=""
        type="Spectre"
        recruit="Ghost, Vampire Bat, Blood Bat, Wraith, Shadow"
        [ai]
            village_value=20
        [/ai]
    [/side]

    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 ("Blood Bat") ({ON_DIFFICULTY4 1 1 2 3})}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 ("Wraith") ({ON_DIFFICULTY4 1 1 2 2})}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 3 ("Shadow") ({ON_DIFFICULTY4 1 2 2 3})}

    # side 4: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=4
        team_name="Undead"
        user_team_name= _ "Undead"
        {FLAG_VARIANT undead}
        color=white
        id=CorpseLeader1
        name=""
        type="Necrophage"
        recruit="Soulless,Walking Corpse,Ghoul"
        [ai]
            village_value=20
        [/ai]
    [/side]

    {RECRUIT_UNIT_VARIATIONS 4 "Walking Corpse" ("none,dwarf,wolf,saurian,wose")}
    {RECRUIT_UNIT_VARIATIONS 4 "Soulless" ("none,dwarf,wolf,saurian,wose")}

    {LIMIT_CONTEMPORANEOUS_RECRUITS 4 ("Soulless") ({ON_DIFFICULTY4 4 5 5 6})}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 4 ("Ghoul") ({ON_DIFFICULTY4 4 5 5 6})}

    # side 5: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=5
        team_name="Undead"
        user_team_name= _ "Undead"
        {FLAG_VARIANT undead}
        color=white

        id=CorpseLeader2
        generate_name=yes
        type="Dark Sorcerer"
        [modifications]
            {TRAIT_RESISTANT}
            {TRAIT_INTELLIGENT}
        [/modifications]
        gender=female

        recruit="Soulless,Walking Corpse,Ghoul,Skeleton Rider"
        [ai]
            village_value=20
        [/ai]
    [/side]

    {RECRUIT_UNIT_VARIATIONS 5 "Walking Corpse" ("none,dwarf,wolf,saurian,wose")}
    {RECRUIT_UNIT_VARIATIONS 5 "Soulless" ("none,dwarf,wolf,saurian,wose")}

    {LIMIT_CONTEMPORANEOUS_RECRUITS 5 ("Soulless") ({ON_DIFFICULTY4 4 5 5 6})}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 5 ("Ghoul") ({ON_DIFFICULTY4 4 5 5 6})}

    # side 6: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=6
        team_name="Undead"
        user_team_name= _ "Undead"
        {FLAG_VARIANT undead}
        color=white
        id=GhostShip1
        name=""
        type="Ghost Ship"
        recruit="Derelict,Ghost Ship,Soulless"
        [ai]
            village_value=20
            [avoid]
                [not]
                    terrain=W*
                [/not]
            [/avoid]
        [/ai]
    [/side]

    {LIMIT_CONTEMPORANEOUS_RECRUITS 6 ("Ghost Ship") ({ON_DIFFICULTY4 1 1 2 2})}
    {RECRUIT_UNIT_VARIATIONS 6 "Soulless" ("swimmer,swimmer,serpent,bat")}

    # only on Hard or Nightmare
    # event: turn 13
    [event]
        {QUANTITY4 name (unused_event) (unused_event) ("turn 13") ("turn 13")}

        [modify_side]
            side=3
            {INCOME4 4 6 20 30}
            recruit="Ghost, Vampire Bat, Blood Bat"
        [/modify_side]
        [gold]
            side=3
            {QUANTITY4 amount 0 0 63 84}
        [/gold]
    [/event]

    {STARTING_VILLAGES_ALL 1}

    # event: prestart
    [event]
        name=prestart

        # ships for the player
        {LOYAL_UNIT 1 ("Merchant Carrack") 17 11}
        {LOYAL_UNIT 1 ("Merchant Carrack") 16 16}
        {LOYAL_UNIT 1 ("Skiff") 13 16}
        {LOYAL_UNIT 1 ("Skiff") 14 18}

        # Elensefar guards
        {LOYAL_UNIT 1 ("Heavy Infantryman") 30 13}
        {LOYAL_UNIT 1 ("Heavy Infantryman") 25 23}
        {LOYAL_UNIT 1 ("Heavy Infantryman") 29 21}

        [unit]
            x,y=34,17
            type="Elensefar Lighthouse"
            name=_ "South Lighthouse"
            side=1
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
            {IS_LOYAL}
        [/unit]
        #  [time_area]
        #      x,y=22,22
        #      radius=2
        #      id=lighthouse_south
        #      {DOE_LIT_SCHEDULE}
        #  [/time_area]
        [unit]
            x,y=14,12
            type="Elensefar Lighthouse"
            name=_ "North Lighthouse"
            side=1
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
            {IS_LOYAL}
        [/unit]
        #  [time_area]
        #      x,y=14,12
        #      radius=2
        #      id=lighthouse_north
        #      {DOE_LIT_SCHEDULE}
        #  [/time_area]

        [unit]
            x,y=24,19
            type="Mortuary Caravan"
            side=1
        [/unit]
        [unit]
            x,y=24,21
            type="Mortuary Caravan"
            side=1
        [/unit]
        #ifdef NIGHTMARE
        [unit]
            x,y=27,21
            type="Mortuary Caravan"
            side=1
        [/unit]
        #endif

        # Add units to Ras-Tabahn's recall list
        #define RAS_HAS_RECALLS COUNT TYPE
        [for]
            start=1
            end={COUNT}
            [do]
                [unit]
                    type={TYPE}
                    side=2
                    placement=recall
                    random_gender=yes
                [/unit]
            [/do]
        [/for]
        #enddef
        {RAS_HAS_RECALLS 5 "Dark Sorcerer"}
        {RAS_HAS_RECALLS ({ON_DIFFICULTY4 1 2 4 4}) "Spectre"}
        {RAS_HAS_RECALLS 5 "Shadow"}
        {RAS_HAS_RECALLS ({ON_DIFFICULTY4 1 1 3 4}) "Nightgaunt"}
        {RAS_HAS_RECALLS 5 "Necrophage"}
        {RAS_HAS_RECALLS ({ON_DIFFICULTY4 1 1 3 4}) "Ghast"}
        {RAS_HAS_RECALLS ({ON_DIFFICULTY4 2 3 4 5}) "Lich"}
        {RAS_HAS_RECALLS ({ON_DIFFICULTY4 1 2 3 3}) "Necromancer"}
        {RAS_HAS_RECALLS ({ON_DIFFICULTY4 0 0 1 1}) "Ancient Lich"}
        #undefine RAS_HAS_RECALLS

        # spawn some elite undead around the Lich keep
        # make it at lease challenging
        {LOYAL_UNIT 2 ("Grim Knight") 58 34}{GUARDIAN}
        {LOYAL_UNIT 2 ("Grim Knight") 57 35}{GUARDIAN}
        {LOYAL_UNIT 2 ("Grim Knight") 58 30}{GUARDIAN}

        [unit]
            side=1
            x,y=20,18
            type="Mounted Warden"
            id="Octalot"
            name=_"Sir Octalot"
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_RESISTANT}
            [/modifications]
        [/unit]

        [unit]
            side=1
            x,y=21,18
            type="Mounted Warden"
            id="Juhhyv"
            name=_"Sir Juhhyv"
            [modifications]
                {TRAIT_LOYAL}
                {TRAIT_RESISTANT}
            [/modifications]
        [/unit]

        # labels
        {SET_LABEL 19 18 (_"Elensefar Keep")}
        {SET_LABEL 17 13 (_"Elensefar Docks")}
        {SET_LABEL 14 12 (_"Northern Lighthouse")}
        {SET_LABEL 34 17 (_"Southern Lighthouse")}

        [store_locations]
            location_id=1
            variable=doe_target_mortuaries
        [/store_locations]

        [micro_ai]
            ca_id="doe_ai_target_mortuaries"
            side=3
            ai_type=goto
            action=add
            avoid_enemies=1
            [filter]
                type_adv_tree="Vampire Bat, Walking Corpse"
            [/filter]
            [filter_location]
                find_in=doe_target_mortuaries
            [/filter_location]
        [/micro_ai]

        [objectives]
            side=1

            [objective]
                description= _ "Defeat the undead commander"
                condition=win
            [/objective]

            [objective]
                description= _ "Death of Lord Karyk"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of Varric"
                condition=lose
            [/objective]
            [objective]
                description= _ "Death of any Mortuary Cavern"
                condition=lose
                [show_if]
                    [have_unit]
                        type="Mortuary Caravan"
                    [/have_unit]
                [/show_if]
            [/objective]
            [objective]
                description= _ "A necromancer stands on Karyk’s keep"
                condition=lose
            [/objective]

            [note]
                description= _ "Choose which houses to move the caravans to. The driver will become a loyal infantryman, but if the undead capture those houses then you will have more undead to deal with."
                [show_if]
                    [have_unit]
                        type="Mortuary Caravan"
                    [/have_unit]
                [/show_if]
            [/note]
            [note]
                description= _ "If the undead capture the houses containing bodies then you will have more undead to deal with."
                [show_if]
                    [not]
                        [have_unit]
                            type="Mortuary Caravan"
                        [/have_unit]
                    [/not]
                [/show_if]
            [/note]
            [note]
                description= _ "If a necromancer captures the castle then there will be an overwhelming swarm of undead from the cellar."
            [/note]

            {IS_LAST_SCENARIO}
        [/objectives]
    [/event]

    # event: start
    [event]
        name=start

        [message]
            type="Mortuary Caravan"
            message= _ "We bring the last of the bodies from Carcyn’s graveyard, there are none left for the necromancers to defile."
        [/message]
        [message]
            speaker="Karyk"
            message= _ "Thank you. Sadly we must use some of the houses’ cellars as mortuaries, for the castle’s cellars are already full."
        [/message]
        [message]
            speaker=narrator
            message= _ "Move the caravans to the houses that you choose. If the undead capture that village then they'll immediately raise some of the corpses. <b>The castle has more bodies than the houses, if a necromancer captures that then it’s instant defeat.</b>"
            image=wesnoth-icon.png
        [/message]

        # north
        {SCROLL_TO 36 7}
        [unit]
            x,y=36,7
            side=1
            type="Cavalryman"
            id="NorthScout"
            animate=yes
        [/unit]
        {MOVE_UNIT (id="NorthScout") (33,33,29,26) (9,11,13,14)}

        [message]
            speaker="NorthScout"
            message= _ "Lord Karyk! A host of ghosts and bats pours out of the northern marshes. They move faster than our foot troops can answer."
        [/message]
        [message]
            id=Karyk
            message= _ "Hold the paths between the exteriors and the marsh. The ridges by the lighthouses are too exposed; fall back if they press you."
        [/message]
        [message]
            speaker="NorthScout"
            message= _ "Aye. The lighthouse keeps them in sight, but the treeline hides their stalkers. We will buy what time we can."
        [/message]

        # south
        {SCROLL_TO 37 27}
        [unit]
            x,y=37,27
            side=1
            type="Cavalryman"
            id="SouthScout"
            animate=yes
        [/unit]
        {MOVE_UNIT (id="SouthScout") (34,31,27) (24,23,21)}

        [message]
            speaker="SouthScout"
            message= _ "My lord! The main horde marches from the south. Necromancers drive corpses like cattle, and a hooded lord commands from the rear."
        [/message]
        [message]
            id=Karyk
            message= _ "Then the river is no barrier to them. Fall back to the docks and make ready to burn the piers if they press too hard."
        [/message]
        [message]
            speaker="SouthScout"
            message= _ "Understood. We will harry them, but they will be upon us before dusk."
        [/message]

        [message]
            id=Karyk
            message= _ "We are attacked from north and south, and the cemetery wagons are spent. This is the last stand of Elensefar."
        [/message]
        [message]
            type="Heavy Infantryman"
            side=1
            message= _ "If we fall, the city falls. We will hold the keep and every hearth around it, my lord."
        [/message]
        [message]
            speaker="Karyk"
            message= _ "Remember—lose the keep or the mortuary houses and the necromancers will drown us in our own dead. Steel your hearts. We fight for every family in these walls."
        [/message]
        [message]
            id=Varric
            message= _ "Father, the men watch me. Give me the south wall, and I will make them think the river itself fights for us."
        [/message]
        [message]
            id=Karyk
            message= _ "Take it, Varric. Keep your shieldmen close and your bowmen closer. Do not overreach—we do not yet know which lich commands them."
        [/message]
    [/event]

    # event: Ras makes his offer
    [event]
        name=ras_makes_his_offer

        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]

        [message]
            speaker=Ras-Tabahn
            message= _ "Greetings! I come with an offer. An offer of training in the magical arts. An offer of learning, adventure, and escape from this town."
        [/message]
        [message]
            speaker=Varric
            message= _ "An offer to become an apprentice with a mind obsessed with death."
            scroll=no
        [/message]
        [message]
            speaker=Ras-Tabahn
            message= _ "Exactly. Those with a mind will become my apprentices, those mindless enough to refuse will serve mindlessly."
        [/message]

        [message]
            speaker=Karyk
            message= _ "Your so-called offer? You trade in promises of power and freedom, but the price is death and disgrace! Not one soul in Elensefar would stoop to your vile apprenticeship."
            scroll=no
        [/message]
        [message]
            speaker=Ras-Tabahn
            message= _ "Stubborn pride in the face of the inevitable. Why not spare your people and accept, Lord?"
        [/message]
        [message]
            speaker=Karyk
            message= _ "Spare my people? You defile everything you touch—there will be no surrender. We will defend these walls, these homes, until none of us draw breath, rather than yield to your corruption."
            scroll=no
        [/message]
        [message]
            speaker=Ras-Tabahn
            message= _ "So be it. May your stubbornness die with you, Karyk."
            scroll=no
        [/message]
        [message]
            speaker=Karyk
            message= _ "If we fall, your wretched minions will find our blades in their hearts to the very last. This city spits on your offer."
            scroll=no
        [/message]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            type="Mortuary Caravan"
        [/filter]
        [kill]
            # this uses $unit instead of $x1,$y1 to make the auto-store happen before the kill
            x,y=$unit.x,$unit.y
        [/kill]
        [item]
            x,y=$x1,$y1
            halo=halo/elven/elven-shield-halo-60pct.png
        [/item]
        [unit]
            side=1
            type="Infantryman"
            x,y=$x1,$y1
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
            {IS_LOYAL}
            moves=0
            max_moves=0
        [/unit]
        # The bats know about the villages, and the castle.
        [store_locations]
            x,y=$x1,$y1
            variable=doe_target_mortuaries
            mode=append
        [/store_locations]

        [event]
            delayed_variable_substitution=no
            name=capture
            [filter]
                x,y=$x1,$y1
                side=2,3
            [/filter]
            [fire_event]
                name=mortuary_village_captured
                [primary_unit]
                    x,y=$x1,$y1
                [/primary_unit]
            [/fire_event]
            [fire_event]
                name=mortuary_captured
                [primary_unit]
                    x,y=$x1,$y1
                [/primary_unit]
            [/fire_event]
        [/event]
    [/event]

    [event]
        # Update the AI goals after a target is captured.
        name=mortuary_captured
        first_time_only=no
        [store_locations]
            find_in=doe_target_mortuaries
            [not]
                x,y=$x1,$y1
            [/not]
            variable=doe_target_mortuaries
        [/store_locations]
        [if]
            [variable]
                name=doe_target_mortuaries.length
                numerical_equals=0
            [/variable]
            [then]
                [micro_ai]
                    ca_id="doe_ai_target_mortuaries"
                    side=3
                    ai_type=goto
                    action="delete"
                [/micro_ai]
            [/then]
        [/if]
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
    [/event]

    # The following event logic makes northern enemy bats able to raise walking corpses when they capture mortuary villages.
    # This supports the gameplay goal of forcing the player to defend those two northern villages, not just focusing on necromancers.
    # The justification is that Ras has prepared enchanted items, powered by his magic and delivered by bats, to raise some corpses even when necromancers are absent.
    # event: mortuary village captured
    [event]
        # Either this or the non-bat-version can be fired once per caravan
        name=mortuary_village_captured
        first_time_only=no
        [filter]
            race="bats"
            [or]
                [filter_wml]
                    variation=bat
                [/filter_wml]
            [/or]
        [/filter]
        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]

        [message]
            # use $unit to make the auto-store happen before the transform
            id=$unit.id
            message= _ "Neep! Neep!"
        [/message]
        [message]
            id=Ras-Tabahn
            message= _ "These bodies shall join my minions!"
            scroll=no
        [/message]
        # Ras is likely off-screen, but trigger the sound anyway
        [sound]
            name=magic-dark.ogg
        [/sound]
        # Remove the halo that was placed by the caravan
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
        [item]
            x,y=$x1,$y1
            image=misc/blank-hex.png
            halo="halo/undead/black-magic-[1~5].png"
        [/item]
        [if]
            [have_unit]
                id=$unit.id
                race="bats"
            [/have_unit]
            [then]
                [kill]
                    x,y=$x1,$y1
                    animate=yes
                [/kill]
                # Place the unit now, so that the walking corpses spawn on surrounding hexes
                [unit]
                    type=Walking Corpse
                    variation=bat
                    # po: The undead bat is about to speak, so the unit type will be shown if it doesn't have a name, and a bat isn't "Walking"
                    name=_ "Flying Corpse"
                    x,y=$x1,$y1
                    moves=0
                    side=$unit.side
                    experience=$unit.experience
                    animate=yes
                [/unit]
            [/then]
        [/if]
        [for]
            # Only 2 corpses, to give the player some chance of recovery
            start=1
            end=2
            [do]
                [unit]
                    type="Walking Corpse"
                    x,y=$x1,$y1
                    moves=0
                    side=2
                    animate=yes
                [/unit]
            [/do]
        [/for]
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
        [fire_event]
            name=bat_transformed_to_undead
            [primary_unit]
                x,y=$x1,$y1
            [/primary_unit]
        [/fire_event]
    [/event]

    # event: mortuary village captured dialogue
    [event]
        name=bat_transformed_to_undead
        [message]
            x,y=$x1,$y1
            message= _ "Neeeeeeeep!"
            scroll=no
        [/message]
        [message]
            side=1
            type_adv_tree="Bowman, Cavalryman, Heavy Infantryman, Adept of Light, Infantryman"
            canrecruit=no
            message= _ "Even the bats can do that?"
            scroll=no
        [/message]
        [message]
            speaker=Karyk
            message= _ "The magic came from the bat’s leg-ring."
            scroll=no
        [/message]
    [/event]

    # event: mortuary village captured
    [event]
        # Either this or the bat-version can be fired once per caravan
        name=mortuary_village_captured
        first_time_only=no
        [filter]
            [not]
                race="bats"
                [or]
                    [filter_wml]
                        variation=bat
                    [/filter_wml]
                [/or]
            [/not]
        [/filter]
        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]
