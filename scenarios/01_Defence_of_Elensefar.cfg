#textdomain wesnoth-Defence_of_Elensefar
[scenario]
    experience_modifier={ON_DIFFICULTY4 80 80 100 120}
    id="01_Defence_of_Elensefar"
    map_file=Defence_of_Elensefar.map
    name= _ "Defence of Elensefar"

    random_start_time=no
    victory_when_enemies_defeated=yes
    next_scenario="02_Epilogue"

    # no turn limit
    turns=-1

    {WINTER_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    # story text
    [story]
        {DOE_PROLOGUE_STORY_OF_SOTA}
    [/story]

    # side 1: player (Elensefar)
    [side]
        controller="human"
        fog=yes
        {GOLD4 300 275 250 225}
        hidden=no
        income=4
        share_vision="none"
        shroud=yes
        fog=yes
        side=1
        team_name="Heroes"
        user_team_name= _ "Elensefar"
        color=green
        id=Karyk
        name= _ "Karyk"
        unrenamable=yes
        facing="ne"
        type="Iron Mauler"
        [modifications]
            {TRAIT_AGED}
            {TRAIT_INTELLIGENT}
        [/modifications]
        recruit="Bowman, Infantryman, Cavalryman, Adept of Light, Heavy Infantryman"
    [/side]

    # side 2: undead
    [side]
        controller="ai"
        fog=no
        facing=nw
        {GOLD4 200 220 220 250}
        hidden=no
        {INCOME4 40 50 50 60}
        no_leader=no
        share_vision="none"
        shroud=no
        side=2
        team_name="Undead"
        user_team_name= _ "Undead"
        color=white
        id=Ras-Tabahn
        name="King Ras–Tabahn"
        type="Ancient Lich"
        recruit="Walking Corpse, Soulless, Dark Adept, Ghost, Ghoul"
        [ai]
            village_value=20
        [/ai]
    [/side]

    # Give some flavor to Ras' corpse recruits
    {RECRUIT_UNIT_VARIATIONS 2 "Walking Corpse" ("none,dwarf,wolf,saurian,wose")}
    {RECRUIT_UNIT_VARIATIONS 2 "Soulless" ("none,dwarf,wolf,saurian,wose")}

    # side 3: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=3
        team_name="Undead"
        user_team_name= _ "Undead"
        color=white
        id=NorthLeader
        name=""
        type="Spectre"
        recruit="Ghost, Vampire Bat"
        [ai]
            village_value=20
        [/ai]
    [/side]

    # side 4: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=4
        team_name="Undead"
        user_team_name= _ "Undead"
        color=white
        id=CorpseLeader1
        name=""
        type="Necrophage"
        recruit="Soulless,Walking Corpse,Ghoul"
        [ai]
            village_value=20
        [/ai]
    [/side]

    {RECRUIT_UNIT_VARIATIONS 4 "Walking Corpse" ("none,dwarf,wolf,saurian,wose")}
    {RECRUIT_UNIT_VARIATIONS 4 "Soulless" ("none,dwarf,wolf,saurian,wose")}

    {LIMIT_CONTEMPORANEOUS_RECRUITS 4 ("Soulless") ({ON_DIFFICULTY4 4 5 5 6})}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 4 ("Ghoul") ({ON_DIFFICULTY4 4 5 5 6})}

    # side 5: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=5
        team_name="Undead"
        user_team_name= _ "Undead"
        color=white
        id=CorpseLeader1
        name=""
        type="Necrophage"
        recruit="Soulless,Walking Corpse,Ghoul"
        [ai]
            village_value=20
        [/ai]
    [/side]

    {RECRUIT_UNIT_VARIATIONS 5 "Walking Corpse" ("none,dwarf,wolf,saurian,wose")}
    {RECRUIT_UNIT_VARIATIONS 5 "Soulless" ("none,dwarf,wolf,saurian,wose")}

    {LIMIT_CONTEMPORANEOUS_RECRUITS 5 ("Soulless") ({ON_DIFFICULTY4 4 5 5 6})}
    {LIMIT_CONTEMPORANEOUS_RECRUITS 5 ("Ghoul") ({ON_DIFFICULTY4 4 5 5 6})}

    # side 6: undead
    [side]
        controller="ai"
        fog=no
        facing=sw
        {GOLD4 50 60 70 80}
        hidden=no
        {INCOME4 4 6 15 20}
        no_leader=no
        share_vision="none"
        shroud=no
        side=6
        team_name="Undead"
        user_team_name= _ "Undead"
        color=white
        id=GhostShip1
        name=""
        type="Ghost Ship"
        recruit="Derelict,Ghost Ship"
        [ai]
            village_value=20
        [/ai]
    [/side]

    {LIMIT_CONTEMPORANEOUS_RECRUITS 5 ("Ghost Ship") ({ON_DIFFICULTY4 1 1 2 2})}

    # Hard difficulty allows this side to recruit blood bats, so the gold and income are much higher to match the more expensive units and upkeep.
    [event]
        {QUANTITY4 name (unused_event) (unused_event) (turn 13) (turn 13)}
        [message]
            type="DoE Lighthouse"
            message=_ "I just saw a flock of bats arriving on the north side of the river."
        [/message]
        [modify_side]
            side=3
            {INCOME4 4 6 20 30}
            recruit="Ghost, Vampire Bat, Blood Bat"
        [/modify_side]
        [gold]
            side=3
            {QUANTITY4 amount 0 0 63 84}
        [/gold]
    [/event]

    {STARTING_VILLAGES_ALL 1}

    [event]
        {QUANTITY4 name (turn 13) (turn 19) (turn 25) (turn 25)}
        [modify_side]
            side=2
            income=25
        [/modify_side]
        [if]
            [have_unit]
                side=1
                type="DoE Lighthouse"
            [/have_unit]
            [then]
                [message]
                    type="DoE Lighthouse"
                    message=_ "Finally we see fewer undead arriving on the path from Carcyn."
                [/message]
            [/then]
            [else]
                # Not a hugely useful unit for a land battle, but free
                [unit]
                    type="Merman Fighter"
                    location_id=merfolk_reinforcements
                    [modifications]
                        {TRAIT_LOYAL}
                        {TRAIT_QUICK}
                    [/modifications]
                    {IS_LOYAL}
                [/unit]
                [redraw]
                    clear_fog=yes
                [/redraw]
                [message]
                    race=merman
                    message= _ "There are still some of these fiends on the path from Carcyn, but soon the undead reinforcements will stop coming."
                [/message]
            [/else]
        [/if]
        [message]
            id=Karyk
            message= _ "That is welcome news, if we can hold out a little longer then we may prevail."
        [/message]
    [/event]

    [event]
        name=prestart

        # ships for the player
        {LOYAL_UNIT 1 ("Merchant Carrack") 17 11}
        {LOYAL_UNIT 1 ("Merchant Carrack") 16 16}
        {LOYAL_UNIT 1 ("Skiff") 13 16}
        {LOYAL_UNIT 1 ("Skiff") 14 18}

        # Elensefar guards
        {LOYAL_UNIT 1 ("Heavy Infantryman") 30 13}
        {LOYAL_UNIT 1 ("Heavy Infantryman") 25 23}
        {LOYAL_UNIT 1 ("Heavy Infantryman") 29 21}

        [unit]
            x,y=34,17
            type="DoE Lighthouse"
            name=_ "South Lighthouse"
            side=1
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
            {IS_LOYAL}
        [/unit]
        #  [time_area]
        #      x,y=22,22
        #      radius=2
        #      id=lighthouse_south
        #      {DOE_LIT_SCHEDULE}
        #  [/time_area]
        [unit]
            x,y=14,12
            type="DoE Lighthouse"
            name=_ "North Lighthouse"
            side=1
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
            {IS_LOYAL}
        [/unit]
        #  [time_area]
        #      x,y=14,12
        #      radius=2
        #      id=lighthouse_north
        #      {DOE_LIT_SCHEDULE}
        #  [/time_area]

        [unit]
            x,y=24,19
            type="DoE Mortuary Caravan"
            side=1
        [/unit]
        [unit]
            x,y=24,21
            type="DoE Mortuary Caravan"
            side=1
        [/unit]
        #ifdef NIGHTMARE
        [unit]
            x,y=27,21
            type="DoE Mortuary Caravan"
            side=1
        [/unit]
        #endif

        # Add units to Ras-Tabahn's recall list
        #define RAS_HAS_RECALLS COUNT TYPE
        [for]
            start=1
            end={COUNT}
            [do]
                [unit]
                    type={TYPE}
                    side=2
                    placement=recall
                    random_gender=yes
                [/unit]
            [/do]
        [/for]
        #enddef
        {RAS_HAS_RECALLS 5 "Dark Sorcerer"}
        {RAS_HAS_RECALLS {ON_DIFFICULTY4 1 2 4 4} Spectre}
        {RAS_HAS_RECALLS 5 Shadow}
        {RAS_HAS_RECALLS {ON_DIFFICULTY4 1 1 3 4} Nightgaunt}
        {RAS_HAS_RECALLS 5 Necrophage}
        {RAS_HAS_RECALLS {ON_DIFFICULTY4 1 1 3 4} Ghast}
        {RAS_HAS_RECALLS {ON_DIFFICULTY4 2 3 4 5} Lich}
        {RAS_HAS_RECALLS {ON_DIFFICULTY4 0 0 1 1} "Ancient Lich"}
        #undefine RAS_HAS_RECALLS

        [store_locations]
            location_id=1
            variable=doe_target_mortuaries
        [/store_locations]

        [micro_ai]
            ca_id="doe_ai_target_mortuaries"
            side=3
            ai_type=goto
            action=add
            avoid_enemies=1
            [filter]
                type_adv_tree="Vampire Bat, Walking Corpse"
            [/filter]
            [filter_location]
                find_in=doe_target_mortuaries
            [/filter_location]
        [/micro_ai]

        [objectives]
            side=1

            [objective]
                description= _ "Defeat the undead commander"
                condition=win
            [/objective]

            [objective]
                description= _ "Death of Karyk"
                condition=lose
            [/objective]
            [objective]
                description= _ "A necromancer stands on Karyk’s keep"
                condition=lose
            [/objective]

            [note]
                description= _ "Choose which houses to move the caravans to. The driver will become a loyal infantryman, but if the undead capture those houses then you will have more undead to deal with."
                [show_if]
                    [have_unit]
                        type="DoE Mortuary Caravan"
                    [/have_unit]
                [/show_if]
            [/note]
            [note]
                description= _ "If the undead capture the houses containing bodies then you will have more undead to deal with."
                [show_if]
                    [not]
                        [have_unit]
                            type="DoE Mortuary Caravan"
                        [/have_unit]
                    [/not]
                [/show_if]
            [/note]
            [note]
                description= _ "If a necromancer captures the castle then there will be an overwhelming swarm of undead from the cellar."
            [/note]

            {IS_LAST_SCENARIO}
        [/objectives]
    [/event]

    [event]
        name=start
        [message]
            type="DoE Mortuary Caravan"
            message= _ "We bring the last of the bodies from Carcyn’s graveyard, there are none left for the necromancers to defile."
        [/message]
        [message]
            side=1
            canrecruit=yes
            message= _ "Thank you. Sadly we must use some of the houses’ cellars as mortuaries, for the castle’s cellars are already full."
        [/message]
        [message]
            speaker=narrator
            message= _ "Move the caravans to the houses that you choose. If the undead capture that village then they'll immediately raise some of the corpses. The castle has more bodies than the houses, if a necromancer captures that then it’s instant defeat"
            image=wesnoth-icon.png
        [/message]
    [/event]

    [event]
        # Still working out when to trigger this part of the intro text, so it's an event fired from another event
        name=ras_makes_his_offer
        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]
        [message]
            speaker=Ras-Tabahn
            # po: copied from SotA's Carcyn scenario
            message= _ "Greetings! I come with an offer. An offer of training in the magical arts. An offer of learning, adventure, and escape from this town."
        [/message]
        [message]
            side=1
            canrecruit=yes
            message= _ "An offer to become an apprentice with a mind obsessed with death."
            scroll=no
        [/message]
        [message]
            speaker=Ras-Tabahn
            message= _ "Exactly. Those with a mind will become my apprentices, those mindless enough to refuse will serve mindlessly."
        [/message]
    [/event]

    [event]
        name=moveto
        first_time_only=no
        [filter]
            type="DoE Mortuary Caravan"
        [/filter]
        [kill]
            # this uses $unit instead of $x1,$y1 to make the auto-store happen before the kill
            x,y=$unit.x,$unit.y
        [/kill]
        [item]
            x,y=$x1,$y1
            halo=halo/elven/elven-shield-halo-60pct.png
        [/item]
        [unit]
            side=1
            type="Infantryman"
            x,y=$x1,$y1
            [modifications]
                {TRAIT_LOYAL}
            [/modifications]
            {IS_LOYAL}
            moves=0
        [/unit]
        # The bats know about the villages, and the castle.
        [store_locations]
            x,y=$x1,$y1
            variable=doe_target_mortuaries
            mode=append
        [/store_locations]

        [event]
            delayed_variable_substitution=no
            name=capture
            [filter]
                x,y=$x1,$y1
                side=2,3
            [/filter]
            [fire_event]
                name=mortuary_village_captured
                [primary_unit]
                    x,y=$x1,$y1
                [/primary_unit]
            [/fire_event]
            [fire_event]
                name=mortuary_captured
                [primary_unit]
                    x,y=$x1,$y1
                [/primary_unit]
            [/fire_event]
        [/event]
    [/event]

    [event]
        # Update the AI goals after a target is captured.
        name=mortuary_captured
        first_time_only=no
        [store_locations]
            find_in=doe_target_mortuaries
            [not]
                x,y=$x1,$y1
            [/not]
            variable=doe_target_mortuaries
        [/store_locations]
        [if]
            [variable]
                name=doe_target_mortuaries.length
                numerical_equals=0
            [/variable]
            [then]
                [micro_ai]
                    ca_id="doe_ai_target_mortuaries"
                    side=3
                    ai_type=goto
                    action="delete"
                [/micro_ai]
            [/then]
        [/if]
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
    [/event]

    # For gameplay I want the player to defend those two villages from the northern enemy's bats, which is why any unit can raise some walking corpses instead of just necromancers.
    #
    # Justification: Ras had been planning this siege for a while and has known for a couple of days that all the graves in Carcyn were emptied. He's worked out how to enchant items that will raise at least a few walking corpses, possibly needing him to be nearby to power the items, and that can be carried by the bats.
    [event]
        # Either this or the non-bat-version can be fired once per caravan
        name=mortuary_village_captured
        first_time_only=no
        [filter]
            race="bats"
            [or]
                [filter_wml]
                    variation=bat
                [/filter_wml]
            [/or]
        [/filter]
        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]

        [message]
            # use $unit to make the auto-store happen before the transform
            id=$unit.id
            message= _ "Neep! Neep!"
        [/message]
        [message]
            id=Ras-Tabahn
            message= _ "These bodies shall join my minions!"
            scroll=no
        [/message]
        # Ras is likely off-screen, but trigger the sound anyway
        [sound]
            name=magic-dark.ogg
        [/sound]
        # Remove the halo that was placed by the caravan
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
        [item]
            x,y=$x1,$y1
            image=misc/blank-hex.png
            halo="halo/undead/black-magic-[1~5].png"
        [/item]
        [if]
            [have_unit]
                id=$unit.id
                race="bats"
            [/have_unit]
            [then]
                [kill]
                    x,y=$x1,$y1
                    animate=yes
                [/kill]
                # Place the unit now, so that the walking corpses spawn on surrounding hexes
                [unit]
                    type=Walking Corpse
                    variation=bat
                    # po: The undead bat is about to speak, so the unit type will be shown if it doesn't have a name, and a bat isn't "Walking"
                    name=_ "Flying Corpse"
                    x,y=$x1,$y1
                    moves=0
                    side=$unit.side
                    experience=$unit.experience
                    animate=yes
                [/unit]
            [/then]
        [/if]
        [for]
            # Only 2 corpses, to give the player some chance of recovery
            start=1
            end=2
            [do]
                [unit]
                    type="Walking Corpse"
                    x,y=$x1,$y1
                    moves=0
                    side=2
                    animate=yes
                [/unit]
            [/do]
        [/for]
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
        [fire_event]
            name=bat_transformed_to_undead
            [primary_unit]
                x,y=$x1,$y1
            [/primary_unit]
        [/fire_event]
    [/event]

    [event]
        # Separate event so that the dialogue only happens once, even if both villages are captured by bats
        name=bat_transformed_to_undead
        [message]
            x,y=$x1,$y1
            message= _ "Neeeeeeeep!"
            scroll=no
        [/message]
        [message]
            side=1
            type_adv_tree="Bowman, Cavalryman, Heavy Infantryman, Adept of Light, Infantryman"
            canrecruit=no
            message= _ "Even the bats can do that?"
            scroll=no
        [/message]
        [message]
            speaker=Karyk
            message= _ "The magic came from the bat’s leg-ring."
            scroll=no
        [/message]
        [message]
            side=1
            type_adv_tree="Footpad, Poacher, Thief, Thug"
            message= _ "And after seeing what happened to the bat, there’ll be no looting after this battle."
            scroll=no
        [/message]
    [/event]

    [event]
        # Either this or the bat-version can be fired once per caravan
        name=mortuary_village_captured
        first_time_only=no
        [filter]
            [not]
                race="bats"
                [or]
                    [filter_wml]
                        variation=bat
                    [/filter_wml]
                [/or]
            [/not]
        [/filter]
        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]
        [message]
            speaker=unit
            message= _ "Bodies!"
        [/message]
        [message]
            id=Ras-Tabahn
            message= _ "They shall join my minions!"
            scroll=no
        [/message]
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
        [for]
            start=1
            end=3
            [do]
                [unit]
                    type="Walking Corpse"
                    x,y=$x1,$y1
                    moves=0
                    side=2
                    animate=yes
                [/unit]
            [/do]
        [/for]
    [/event]

    [event]
        name=side 1 turn 1 end
        [fire_event]
            name=ras_makes_his_offer
        [/fire_event]
    [/event]

    [event]
        name=lighthouse_sees_stalker
        [scroll_to_unit]
            id=$second_unit.id
            highlight=yes
        [/scroll_to_unit]
        [message]
            speaker=unit
            message=_ "Look out, there’s a barely visible ghost there."
            scroll=no
            highlight=no
        [/message]
        [message]
            id=Karyk
            message=_ "With the lighthouse, can you look out for more of those?"
            scroll=no
            highlight=no
        [/message]
        [message]
            speaker=unit
            message=_ "Now we know what we’re looking for, yes. But it’s not easy to see beyond the treeline."
            scroll=no
            highlight=no
        [/message]
    [/event]

    # The location id is player 1's starting position, this event is to ensure that only one of the bat-version or non-bat-version of castle_captured_by_non_necromancer will be triggered in a game.
    [event]
        name=moveto
        [filter]
            [filter_location]
                location_id=1
            [/filter_location]
            side=2,3
            [not]
                type_adv_tree="Dark Adept,Ancient Lich"
            [/not]
        [/filter]
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]
        [fire_event]
            name=castle_captured_by_non_necromancer
            [primary_unit]
                x,y=$x1,$y1
            [/primary_unit]
        [/fire_event]
        [fire_event]
            name=mortuary_captured
            [primary_unit]
                x,y=$x1,$y1
            [/primary_unit]
        [/fire_event]
    [/event]
    [event]
        name=castle_captured_by_non_necromancer
        [filter]
            side=2,3
            [and]
                race="bats"
                [or]
                    [filter_wml]
                        variation=bat
                    [/filter_wml]
                [/or]
            [/and]
        [/filter]
        [message]
            speaker=unit
            message= _ "Neep! Neep!"
        [/message]
        [message]
            id=Ras-Tabahn
            message= _ "Vaults full of bodies! They shall all join my minions, and all of the living defenders soon will too!"
            scroll=no
        [/message]
        [item]
            x,y=$x1,$y1
            image=misc/blank-hex.png
            halo="halo/undead/black-magic-[1~5].png"
        [/item]
        [if]
            [have_unit]
                id=$unit.id
                race="bats"
            [/have_unit]
            [then]
                [kill]
                    x,y=$x1,$y1
                    animate=yes
                [/kill]
                # Place the unit now, so that the walking corpses spawn on surrounding hexes
                [unit]
                    type=Soulless
                    variation=bat
                    # po: The undead bat is about to speak, so the unit type will be shown if it doesn't have a name
                    name=_ "Soulless Bat"
                    x,y=$x1,$y1
                    moves=0
                    side=$unit.side
                    experience=$unit.experience
                    animate=yes
                [/unit]
            [/then]
        [/if]
        [for]
            start=1
            end=6
            [do]
                [unit]
                    type="Walking Corpse"
                    x,y=$x1,$y1
                    moves=0
                    side=2
                    animate=yes
                [/unit]
            [/do]
        [/for]
        [remove_item]
            x,y=$x1,$y1
        [/remove_item]
        [fire_event]
            name=bat_transformed_to_undead
            [primary_unit]
                x,y=$x1,$y1
            [/primary_unit]
        [/fire_event]
    [/event]
    [event]
        name=castle_captured_by_non_necromancer
        [filter]
            side=2,3
            [not]
                race="bats"
                [or]
                    [filter_wml]
                        variation=bat
                    [/filter_wml]
                [/or]
            [/not]
        [/filter]
        [message]
            speaker=unit
            message= _ "Vaults full of bodies!"
        [/message]
        [message]
            id=Ras-Tabahn
            message= _ "They shall all join my minions, and all of the living defenders soon will too!"
            scroll=no
        [/message]
        [for]
            start=1
            end=6
            [do]
                [unit]
                    type="Walking Corpse"
                    x,y=$x1,$y1
                    moves=0
                    side=2
                    animate=yes
                [/unit]
            [/do]
        [/for]
    [/event]

    [event]
        name=moveto
        [filter]
            # The location id is player 1's starting position
            [filter_location]
                location_id=1
            [/filter_location]
            side=2
            type_adv_tree="Dark Adept,Ancient Lich"
        [/filter]

        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]
        [if]
            [have_unit]
                x,y=$x1,$y1
                id=Ras-Tabahn
            [/have_unit]
            [then]
                [message]
                    id=Ras-Tabahn
                    message= _ "Vaults full of bodies! They shall all join my minions, and all of the living defenders soon will too!"
                [/message]
            [/then]
            [else]
                [message]
                    speaker=unit
                    message= _ "Vaults full of bodies! They shall all join my minions, and all of the living defenders soon will too!"
                [/message]
                [if]
                    [have_unit]
                        x,y=$x1,$y1
                        gender=male
                    [/have_unit]
                    [then]
                        [message]
                            id=Ras-Tabahn
                            message= _ "You shall be Duke of Elensefar, and a member of my royal court"
                        [/message]
                    [/then]
                    [else]
                        [message]
                            id=Ras-Tabahn
                            message= _ "You shall be Duchess of Elensefar, and a member of my royal court"
                        [/message]
                    [/else]
                [/if]
            [/else]
        [/if]
        [for]
            start=1
            end=6
            [do]
                [unit]
                    id=undead_victory_recruit_$i
                    type="Wraith"
                    x,y=$x1,$y1
                    side=2
                [/unit]
                # This animation gets the timing right, but doesn't show the normal necromancer-recruiting-undead animation, probably because the standard animation filters on the second unit being undead (and in animate_unit there is no second unit). That's why the sound is played here.
                # SotA has a work around for this - its necromancer units have a "recruit2" animation for triggering from animate_unit
                [sound]
                    name=magic-dark.ogg
                [/sound]
                [animate_unit]
                    [filter]
                        location_id=1
                    [/filter]
                    flag=recruiting
                    hits=yes
                    [facing]
                        [filter]
                            id=undead_victory_recruit_$i
                        [/filter]
                    [/facing]
                    [animate]
                        [filter]
                            id=undead_victory_recruit_$i
                        [/filter]
                        flag=recruited
                        hits=yes
                        [facing]
                            location_id=1
                        [/facing]
                    [/animate]
                [/animate_unit]
            [/do]
        [/for]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    [event]
        name=die
        [filter]
            type="DoE Mortuary Caravan"
        [/filter]
        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]
        [message]
            id=Ras-Tabahn
            message= _ "You left the caravans unprotected? I expected you to at least hide them in the castle."
        [/message]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

    # defeating the undead commander
    [event]
        name=last breath
        [filter]
            id=Ras-Tabahn
        [/filter]
        [message]
            id=Ras-Tabahn
            message= _ "To think I had it all within my grasp. Perhaps she was wiser to have retreated into the mountains; at least she will not suffer a humiliating defeat at the hands of such imbeciles!"
        [/message]
        # Ras-Tabahn is defeated, give the player victory without needing to defeat side 3.
        [if]
            [have_unit]
                id=NorthLeader
            [/have_unit]
            [then]
                # Reveal the whole map, so that side 3 is certain to be visible
                [lift_fog]
                    [filter]
                    [/filter]
                [/lift_fog]
                [kill]
                    side=2
                    animate=no
                [/kill]
                [kill]
                    side=3
                    animate=no
                [/kill]
                [kill]
                    side=4
                    animate=no
                [/kill]
                [kill]
                    side=5
                    animate=no
                [/kill]
                [kill]
                    side=6
                    animate=no
                [/kill]
            [/then]
            [else]
                [message]
                    id=Karyk
                    message= _ "To think of the evil that that lich might have wrought, had we not been able to stop him here. Let us once again allow the dead to rest."
                [/message]
            [/else]
        [/if]
    [/event]

    # event: enemy captures villages
    [event]
        name=capture
        first_time_only=no
        [filter]
            side=2,3,4,5,6
        [/filter]
        {MODIFY_TERRAIN (Dd^Dr) $x1 $y1}
        [sound] 
            name=torch.ogg
        [/sound]
    [/event]

    # ensure enemy leaders are not reckless
    {SILENTLY_LIMIT_LEADER_MOVES  2  1}
    {SILENTLY_LIMIT_LEADER_MOVES  3  1}
    {SILENTLY_LIMIT_LEADER_MOVES  4  1}
    {SILENTLY_LIMIT_LEADER_MOVES  5  1}
    {SILENTLY_LIMIT_LEADER_MOVES  6  1}

[/scenario]
