#textdomain wesnoth-Defence_of_Elensefar

[textdomain]
    name="wesnoth-Defence_of_Elensefar"
[/textdomain]

# wmlscope: set export=no
[campaign]
    id="Defence_of_Elensefar"
    name= _ "Defence of Elensefar"
    abbrev= _ "DoE"
    define=CAMPAIGN_DEFENCE_OF_ELENSEFAR

    icon="items/holy-water.png"

    {CAMPAIGN_DIFFICULTY EASY   "units/human-peasants/spearman.png~RC(magenta>red)" ( _ "Civilian") ( _ "Beginner")}
    {CAMPAIGN_DIFFICULTY NORMAL "units/human-loyalists/swordsman.png~RC(magenta>red)" ( _ "Soldier") ( _ "Normal")} {DEFAULT_DIFFICULTY}
    {CAMPAIGN_DIFFICULTY HARD   "units/human-loyalists/general.png~RC(magenta>red)" ( _ "Veteran") ( _ "Challenging")}
    {CAMPAIGN_DIFFICULTY NIGHTMARE "units/human-loyalists/marshal.png~RC(magenta>red)" ( _ "Impossible?") ( _ "Nightmare")}
    first_scenario="01_Defence_of_Elensefar"

    start_year="23 YW"
    end_year="23 YW"
    # po: As no-one survived at Blackwater, people assume that both attacks were by the same villain, who is male.
    # The Academy has understood data protection, and does not identify students expelled for necromancy, so that a mob don't attack their family.
    description=_ "In 23 YW, a necromancer ransacked Blackwater Port and Carcyn. No–one was left alive to tell the tale in Blackwater, but those who survived in Carcyn told of the necromancer recruiting ruffians and apprentice mages to his cult. Three months after the attack on Carcyn, an army of undead came out of the Northlands. They were met by a huge force unified against necromancy, but that battle was lost. The army of undead next turned towards Elensefar. Now the few who remained in Elensefar must hope to defend it. A single-scenario campaign."

[/campaign]

#ifdef CAMPAIGN_DEFENCE_OF_ELENSEFAR
# load War of Legends
{~add-ons/War_of_Legends/campaign.cfg}

[binary_path]
    path=data/add-ons/Defence_of_Elensefar
[/binary_path]
{./utils}
[units]
    {./units}
[/units]

{./scenarios}
#endif
