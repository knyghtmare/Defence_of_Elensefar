    # event: any Necromancer type unit captures the Elensefar keep
    [event]
        name=moveto
        [filter]
            [filter_location]
                location_id=1
            [/filter_location]
            side=2
            type_adv_tree="Dark Adept,Ancient Lich"
        [/filter]

        [lift_fog]
            [filter]
                id=Ras-Tabahn
            [/filter]
        [/lift_fog]
        [if]
            [have_unit]
                x,y=$x1,$y1
                id=Ras-Tabahn
            [/have_unit]
            [then]
                [message]
                    id=Ras-Tabahn
                    message= _ "Vaults full of bodies! They shall all join my minions, and all of the living defenders soon will too!"
                [/message]
            [/then]
            [else]
                [message]
                    speaker=unit
                    message= _ "Vaults full of bodies! They shall all join my minions, and all of the living defenders soon will too!"
                [/message]
                [if]
                    [have_unit]
                        x,y=$x1,$y1
                        gender=male
                    [/have_unit]
                    [then]
                        [message]
                            id=Ras-Tabahn
                            message= _ "You shall be Duke of Elensefar, and a member of my royal court"
                        [/message]
                    [/then]
                    [else]
                        [message]
                            id=Ras-Tabahn
                            message= _ "You shall be Duchess of Elensefar, and a member of my royal court"
                        [/message]
                    [/else]
                [/if]
            [/else]
        [/if]
        [for]
            start=1
            end=6
            [do]
                [unit]
                    id=undead_victory_recruit_$i
                    type="Wraith"
                    x,y=$x1,$y1
                    side=2
                [/unit]

                [sound]
                    name=magic-dark.ogg
                [/sound]
                [animate_unit]
                    [filter]
                        location_id=1
                    [/filter]
                    flag=recruiting
                    hits=yes
                    [facing]
                        [filter]
                            id=undead_victory_recruit_$i
                        [/filter]
                    [/facing]
                    [animate]
                        [filter]
                            id=undead_victory_recruit_$i
                        [/filter]
                        flag=recruited
                        hits=yes
                        [facing]
                            location_id=1
                        [/facing]
                    [/animate]
                [/animate_unit]
            [/do]
        [/for]
        [endlevel]
            result=defeat
        [/endlevel]
    [/event]

