#textdomain wesnoth-Defence_of_Elensefar

[textdomain]
    name="wesnoth-Defence_of_Elensefar"
[/textdomain]

#ifdef WOL_INSTALLED
#undef WOL_INSTALLED
#endif

#ifhave ~add-ons/War_of_Legends/_main.cfg
#define WOL_INSTALLED
#enddef
#endif

#ifndef WOL_INSTALLED
#define WOL_INSTALLED_STATUS
    "<span font_family='DejaVuSerif' weight='bold'>Dependency:</span> <i>War of Legends</i> <span color='#ff0000'>(✘Not Installed)</span>" #enddef
#else
#define WOL_INSTALLED_STATUS
    "<span font_family='DejaVuSerif' weight='bold'>Dependency:</span> <i>War of Legends</i> <span color='#00ff00'>(✔Installed)</span>" #enddef
#endif

#define DOE_CAMPAIGN_DESC
"<span color='#fff7a4' size='larger'>"+_"Defence of Elensefar"+"</span>"+"
"+"<i>"+_"In 23 YW, a necromancer ransacked Blackwater Port and Carcyn. No–one was left alive to tell the tale in Blackwater, but those who survived in Carcyn told of the necromancer recruiting ruffians and apprentice mages to his cult. Three months after the attack on Carcyn, an army of undead came out of the Northlands. They were met by a huge force unified against necromancy, but that battle was lost. The army of undead next turned towards Elensefar. Now the few who remained in Elensefar must hope to defend it."+"</i>"+"
"+"<span color='#fff7a4'>"+_"(Expert Level, 1 scenarios)"+"</span>"+"
"+"<span color='grey' size='small'>"+_"This campaign accepts donations on Ko-fi: https://ko-fi.com/tahsinjahinkhalid"+"</span>"+"
"+"<span color='grey' size='small'>"+_"Feedback: https://discord.gg/rsePgjHRPA (Wesnoth Modders Guild)"+"</span>"+"
"+"<span color='grey' size='small'>"+_"Requires <i>War of Legends</i> to be installed"+"</span>"+"
"+{WOL_INSTALLED_STATUS}
#enddef


# wmlscope: set export=no
[campaign]
    id="War_of_Legends_Defence_of_Elensefar_scenario"
    name= _ "Defence of Elensefar"
    abbrev= _ "DoE"
    define=CAMPAIGN_DEFENCE_OF_ELENSEFAR

    icon="units/human-loyalists/royal-warrior.png~RC(magenta>red)"
    background="data/campaigns/The_Rise_Of_Wesnoth/images/story/trow_intro_03.webp"

    {CAMPAIGN_DIFFICULTY EASY   "units/human-loyalists/spearman.png~RC(magenta>red)" ( _ "Conscript") ( _ "Normal")}
    {CAMPAIGN_DIFFICULTY NORMAL "units/human-loyalists/swordsman.png~RC(magenta>red)" ( _ "Soldier") ( _ "Challenging")} {DEFAULT_DIFFICULTY}
    {CAMPAIGN_DIFFICULTY HARD   "units/human-loyalists/royalguard.png~RC(magenta>red)" ( _ "Veteran") ( _ "Difficult")}
    {CAMPAIGN_DIFFICULTY NIGHTMARE "units/human-loyalists/royal-warrior.png~RC(magenta>red)" ( _ "Warlord") ( _ "Nightmare")}
    first_scenario="01_Defence_of_Elensefar"

    start_year="23 YW"
    end_year="23 YW"
    # po: As no-one survived at Blackwater, people assume that both attacks were by the same villain, who is male.
    # The Academy has understood data protection, and does not identify students expelled for necromancy, so that a mob don't attack their family.
    description={DOE_CAMPAIGN_DESC}

    [about]
        title = _ "Campaign Design and Programming"
        [entry]
            name = "Tahsin Jahin Khalid / Lord-Knightmare" #wmllint: noconvert
        [/entry]
    [/about]

    # adjust the unit types a bit
    [modify_unit_type]
        type="Infantryman"
        remove_advancement="Chevalier"
    [/modify_unit_type]

    [modify_unit_type]
        type="Bowman"
        add_advancement="Crossbowman"
    [/modify_unit_type]

    [modify_unit_type]
        type="Cavalryman"
        add_advancement="Mounted Bowman"
    [/modify_unit_type]

    [modify_unit_type]
        type="Adept of Light"
        remove_advancement="Cleric"
    [/modify_unit_type]
[/campaign]

#ifdef CAMPAIGN_DEFENCE_OF_ELENSEFAR
# load War of Legends
{~add-ons/War_of_Legends/campaign.cfg}

[binary_path]
    path=data/add-ons/Defence_of_Elensefar
[/binary_path]
{./utils}
[units]
    {./units}
[/units]

{./scenarios}
#endif
